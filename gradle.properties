# Keep local builds usable on the resource-constrained development machine.
# Kotlin shares this JVM instead of starting a second compiler daemon.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

sdkVersion=0.1.1
