name: Set up sideloaded Android build
description: Check out and patch the exact Light SDK, then install the Android toolchain.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        repository: gavdevs/light-sdk
        ref: 52fbc5a8aedbd3c4c88037580709e53540086229
        path: .ci/light-sdk
        persist-credentials: false
    - name: Apply the checked-in Borealis SDK patch
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C .ci/light-sdk rev-parse HEAD)" = '52fbc5a8aedbd3c4c88037580709e53540086229'
        git -C .ci/light-sdk apply --check "$GITHUB_WORKSPACE/patches/light-sdk-borealis.patch"
        git -C .ci/light-sdk apply "$GITHUB_WORKSPACE/patches/light-sdk-borealis.patch"
    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        validate-wrappers: true
    - name: Install Android 36 platform and build tools
      shell: bash
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
