name: Set up sideloaded Android build
description: Check out, patch, and extend the exact Light SDK, then install the Android toolchain.
inputs:
  cache-read-only:
    description: Restore the shared CI cache without uploading a per-release copy.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        # Borealis depends on the exact SDK revision; the guard below fails the
        # build if it ever drifts. This revision carries the package-install
        # and Google-Play-sign-in work in-tree, so no local patch is applied.
        repository: gavdevs/light-sdk
        ref: b1a2d859df773c2d145fdc8fb65d11e108671d5c
        path: .ci/light-sdk
        persist-credentials: false
    - name: Assert the pinned SDK revision
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C .ci/light-sdk rev-parse HEAD)" = 'b1a2d859df773c2d145fdc8fb65d11e108671d5c'
    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ inputs.cache-read-only == 'true' || github.event_name == 'pull_request' }}
        validate-wrappers: true
    - name: Install Android 36 platform and build tools
      shell: bash
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
