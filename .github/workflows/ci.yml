name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Companion and Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      RAYON_NUM_THREADS: '2'
      UV_THREADPOOL_SIZE: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-companion
      - name: Unit and account-isolation tests
        working-directory: companion
        run: pnpm test
      - name: Typecheck and build companion
        working-directory: companion
        run: pnpm build
      - name: Check Cloudflare Worker bundle
        working-directory: companion
        run: pnpm worker:check

  android:
    name: Sideloaded Android
    needs: companion
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Verify the experimental SDK dependency policy
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -p .ci/light-sdk/plugin test
          --tests com.thelightphone.plugin.LightSdkPluginValidationTest
      - name: Unit tests, debug APK, and dependency provenance
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Pborealis.sdkPath=.ci/light-sdk
          --init-script scripts/release-provenance.init.gradle.kts
          :app:testDebugUnitTest :app:assembleDebug :app:writeDebugDependencyProvenance
      - name: Verify dependency provenance contains the Play client and Tink verifier
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          import re
          manifest = Path('app/build/reports/dependency-provenance/debug.tsv')
          with manifest.open() as stream:
              rows = list(csv.DictReader(stream, delimiter='\t'))
          assert any(row['coordinate'] == 'com.auroraoss:gplayapi:3.6.4' for row in rows)
          assert any(row['coordinate'] == 'com.google.crypto.tink:tink:1.20.0' for row in rows)
          sdk_rows = {row['coordinate'] for row in rows if row['coordinate'].startswith('project')}
          assert {'project:light-sdk:sdk:client', 'project:light-sdk:sdk:shared',
                  'project:light-sdk:sdk:ui'} <= sdk_rows, f'Missing SDK artifacts; found {sorted(sdk_rows)}'
          assert all(re.fullmatch('[0-9a-f]{64}', row['sha256']) for row in rows)
          assert any(row['artifact'].endswith('.aar') for row in rows)
          print(f'Verified {len(rows)} resolved dependency hashes.')
          PY
      - name: Prove a release cannot fall back to development signing
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon --max-workers=1 -Pborealis.sdkPath=.ci/light-sdk -Pborealis.companionUrl=https://borealis.loosewire.dev :app:validateReleaseConfiguration > "$RUNNER_TEMP/borealis-release-guard.log" 2>&1; then
            echo 'Release guard unexpectedly accepted missing signing credentials.' >&2
            exit 1
          fi
          grep -q 'BOREALIS_RELEASE_KEYSTORE is required' "$RUNNER_TEMP/borealis-release-guard.log"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/dependency-provenance/
          if-no-files-found: warn
          retention-days: 7
